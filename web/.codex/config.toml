# Project-level Codex config for the w-* skills. Mirrors .mcp.json (Claude Code)
# and .cursor/mcp.json (Cursor). Codex loads it only after you trust the project.

[mcp_servers.atlassian]
url = "https://mcp.atlassian.com/v1/mcp"

[mcp_servers.slack]
command = "npx"
args = ["-y", "@zencoderai/slack-mcp-server"]
env = { SLACK_BOT_TOKEN = "${SLACK_BOT_TOKEN}", SLACK_TEAM_ID = "T0BNQS0TX40", SLACK_CHANNEL_IDS = "C0BMYDZLVND" }
