<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills dashboard · History</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body data-page="history">
<header class="top">
  <div class="brand"><img src="/favicon.svg" alt=""><b>Skills dashboard</b><span id="repo" class="repo"></span></div>
  <nav class="nav"><a href="/">Board</a><a href="/history" class="on">History<span id="history-count"></span></a><a href="/reviews">PRs</a></nav>
  <div class="status-row" id="status-row"></div>
  <div class="actions">
    <button id="refresh" title="Drop PR and JIRA caches and refetch">Refresh</button>
  </div>
</header>

<main>
  <section id="tickets"></section>
</main>

<div id="scrim" class="scrim hidden" data-close></div>
<aside id="detail" class="drawer hidden"></aside>

<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
